name: Rust build environment
description: Pinned Windows toolchain and separate caches for checks and static-runtime distribution builds.
inputs:
  profile:
    description: checks or distribution
    required: true
runs:
  using: composite
  steps:
    - name: Identify checked-out source
      id: source
      shell: pwsh
      run: |
        if ($env:CACHE_PROFILE -notin @('checks', 'distribution')) { throw 'Invalid Rust cache profile.' }
        "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        CACHE_PROFILE: ${{ inputs.profile }}
    - name: Restore Rust build cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.profile == 'checks' && 'target/debug' || 'target/distribution' }}
        key: windows-2025-rust-1.95.0-${{ inputs.profile }}-v2-${{ hashFiles('Cargo.lock') }}-${{ steps.source.outputs.sha }}
        restore-keys: |
          windows-2025-rust-1.95.0-${{ inputs.profile }}-v2-${{ hashFiles('Cargo.lock') }}-
          windows-2025-rust-1.95.0-${{ inputs.profile }}-v2-
    - name: Install Rust
      shell: pwsh
      run: |
        rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        rustup override set 1.95.0
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
