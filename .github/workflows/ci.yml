name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          profile: checks
      - name: Verify source
        shell: pwsh
        run: ./scripts/check.ps1
  distribution:
    # Default-branch caches are visible to version tags; caches from older tags are not.
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          profile: distribution
      - name: Warm installer build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --target-dir target/distribution
