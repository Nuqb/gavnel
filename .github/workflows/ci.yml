name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore Rust dependencies
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/.rustc_info.json
          key: ${{ runner.os }}-rust-1.95-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95-${{ hashFiles('Cargo.lock') }}-
      - name: Test catalog tools
        run: python -S -m unittest discover -s scripts -p "test_*.py"
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Select Rust
        run: rustup override set 1.95.0
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check localization
        run: python scripts/check-locales.py
      - name: Save Rust dependencies
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/.rustc_info.json
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
