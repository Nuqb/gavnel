name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          profile: checks
      - name: Verify source
        shell: pwsh
        run: ./scripts/check.ps1
  distribution:
    # Packages the installer a release tag of this commit tests and publishes,
    # and warms the default-branch cache for releases that must rebuild.
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          profile: distribution
      - name: Build installer and notices
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Keep installer for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: |
            work/releases/*/Gavnel-Setup-*-x64.exe
            work/releases/*/SHA256SUMS.txt
          name: installer-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
