[package]
name = "gavnel"
version = "0.3.4"
edition = "2024"
rust-version = "1.95"
description = "A lightweight Windows replay clipper with GPU capture and NVIDIA hardware encoding"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
global-hotkey = "0.7"
mini-nvcodec = "0.1.0"
mp4 = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.21"
raw-window-handle = "0.6"
windows-core = "0.62"
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
  "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization",
  "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Graphics_DirectX",
  "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Threading",
  "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry", "Win32_System_Performance",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_Devices_FunctionDiscovery"
  , "Win32_Storage_FileSystem"
  , "Win32_UI_HiDpi", "Win32_System_LibraryLoader"
  , "Win32_System_WinRT", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_Gdi"
] }
nnnoiseless = { version = "0.5.2", default-features = false }
rustfft = "6"
png = "0.18"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
semver = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"


[build-dependencies]
winresource = "0.1"

# User-approved, pinned upstream text-direction fix: egui PR #8818.
[patch.crates-io]
egui = { git = "https://github.com/ahmedhosnypro/egui", rev = "87476c112a338f8940c64979dc6b46b90612e195" }
epaint = { git = "https://github.com/ahmedhosnypro/egui", rev = "87476c112a338f8940c64979dc6b46b90612e195" }
eframe = { git = "https://github.com/ahmedhosnypro/egui", rev = "87476c112a338f8940c64979dc6b46b90612e195" }
egui_extras = { git = "https://github.com/ahmedhosnypro/egui", rev = "87476c112a338f8940c64979dc6b46b90612e195" }
egui_glow = { git = "https://github.com/ahmedhosnypro/egui", rev = "87476c112a338f8940c64979dc6b46b90612e195" }
egui-winit = { git = "https://github.com/ahmedhosnypro/egui", rev = "87476c112a338f8940c64979dc6b46b90612e195" }
